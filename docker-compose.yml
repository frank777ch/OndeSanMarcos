# Entorno de desarrollo local: base de datos (Postgres + pgvector) y migraciones (Flyway).
# El backend (FastAPI) y la web (Vite) corren en la máquina, no aquí. Se usa con ./scripts/dev.sh
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      # Solo desarrollo: base local y desechable, sin datos sensibles.
      POSTGRES_USER: ondesanmarcos
      POSTGRES_PASSWORD: ondesanmarcos
      POSTGRES_DB: ondesanmarcos
    ports:
      # Solo en localhost. Cambia el puerto con DB_PORT si el 5432 está ocupado.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Aquí viven los vectores del asistente. `clean` NO lo borra: regenerarlos
      # gasta la cuota de Gemini. Solo `./scripts/dev.sh db-reset` lo borra.
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ondesanmarcos -d ondesanmarcos"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Almacén S3 de las portadas de los lugares. Un solo nodo, solo desarrollo.
  # La imagen no trae shell: el bucket y la llave los crea scripts/place-images.sh con `exec garage ...`.
  garage:
    image: dxflrs/garage:v2.1.0
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      # API S3 (subida): solo localhost. Web pública (lectura): también por la red local, para el celular.
      - "127.0.0.1:${GARAGE_S3_PORT:-3900}:3900"
      - "0.0.0.0:${GARAGE_WEB_PORT:-3902}:3902"

  migrate:
    image: flyway/flyway:11
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/ondesanmarcos
      FLYWAY_USER: ondesanmarcos
      FLYWAY_PASSWORD: ondesanmarcos
    volumes:
      - ./backend/db/migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  garage_meta:
  garage_data:
