# Entorno de desarrollo local: base de datos (Postgres + pgvector), migraciones
# (Flyway), backend (FastAPI) y web (Vite). Se usa con ./script/dev.sh
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      # Solo desarrollo: base local y desechable, sin datos sensibles.
      POSTGRES_USER: ondesanmarcos
      POSTGRES_PASSWORD: ondesanmarcos
      POSTGRES_DB: ondesanmarcos
    ports:
      # Solo en localhost. Cambia el puerto con DB_PORT si el 5432 está ocupado.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Aquí viven los vectores del asistente. `clean` NO lo borra: regenerarlos
      # gasta la cuota de Gemini. Solo `./script/dev.sh db-reset` lo borra.
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ondesanmarcos -d ondesanmarcos"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: flyway/flyway:11
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/ondesanmarcos
      FLYWAY_USER: ondesanmarcos
      FLYWAY_PASSWORD: ondesanmarcos
    volumes:
      - ./backend/db/migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Dentro de Docker la base está en el host `db` (tiene prioridad sobre .env).
      DATABASE_URL: postgresql://ondesanmarcos:ondesanmarcos@db:5432/ondesanmarcos
    # --reload recarga el servidor al editar el código montado en /app.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      # Algunos tests del backend leen archivos de la app anterior (se quita al borrar frontend/).
      - ./frontend:/frontend:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: node:22-alpine
    working_dir: /app
    # Instala dependencias con `npm ci` solo si package-lock.json cambió
    # (no modifica el lockfile del repo).
    command: >
      sh -c "cmp -s package-lock.json node_modules/.lock-copy ||
      (npm ci --no-audit --no-fund && cp package-lock.json node_modules/.lock-copy);
      npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      # node_modules vive en un volumen para no mezclar binarios de macOS y Linux.
      - web_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  web_node_modules:
