# Bloque para un nginx que YA corre en el VPS (modo sin Caddy).
# El puerto 8010 debe coincidir con API_HOST_PORT de deploy/.env.
# 1. Reemplaza TU_DOMINIO y copia a /etc/nginx/sites-available/ondesanmarcos
# 2. sudo ln -s /etc/nginx/sites-available/ondesanmarcos /etc/nginx/sites-enabled/
# 3. sudo nginx -t && sudo systemctl reload nginx
# 4. HTTPS: sudo certbot --nginx -d TU_DOMINIO
#
# /opt/ondesanmarcos es la carpeta donde setup-vps.sh clona el repo.

server {
    listen 80;
    server_name TU_DOMINIO;

    client_max_body_size 16k;

    location ~ ^/(api/|health|docs|openapi\.json) {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        root /opt/ondesanmarcos/deploy/site;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
