name: deploy-vps

# Despliega el backend al VPS en cada push a main que toque backend/ o deploy/.
# Corre la suite primero; si falla, no despliega.
#
# Secrets del repo (Settings → Secrets and variables → Actions):
#   VPS_HOST         IP o dominio del VPS
#   VPS_USER         usuario SSH (miembro del grupo docker)
#   VPS_SSH_KEY      llave privada ed25519 dedicada a este workflow
#   VPS_KNOWN_HOSTS  salida de `ssh-keyscan -t ed25519 <host>`
#   VPS_PORT         (opcional) puerto SSH, por defecto 22
# En el VPS, la llave pública va en ~/.ssh/authorized_keys restringida a
# deploy.sh (ver documents/10-despliegue-vps.md §10.6). Sin VPS_HOST, el job
# de deploy se salta.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Sin VPS configurado
        if: env.VPS_HOST == ''
        run: echo "::notice::Falta el secret VPS_HOST; se omite el despliegue."

      - name: Desplegar por SSH
        if: env.VPS_HOST != ''
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # La llave está restringida en el VPS a correr deploy.sh (command=...).
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST"
