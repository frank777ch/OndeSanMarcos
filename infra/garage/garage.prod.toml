# Garage (almacenamiento S3) para las portadas de los lugares, en PRODUCCIÓN (docker-compose.prod.yml).
# Un solo nodo. Los secretos NO van aquí: Garage lee GARAGE_RPC_SECRET y GARAGE_ADMIN_TOKEN del entorno.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
api_bind_addr = "0.0.0.0:3900"
s3_region = "garage"
root_domain = ".s3.garage.localhost"

# Lectura pública de los buckets con «website» activo. El bucket se enlaza con el alias
# img.ondesanmarcos.site (lo hace scripts/place-images.sh), que es el Host que reenvía Traefik.
[s3_web]
bind_addr = "0.0.0.0:3902"
root_domain = ".web.garage.localhost"
index = "index.html"

[admin]
api_bind_addr = "127.0.0.1:3903"
